dataframeBorderColor = "#2A2D3B"
dataframeHeaderBackgroundColor = "#1A1C27"
greenColor = "#4CD69B"
greenBackgroundColor = "#12291F"
greenTextColor = "#6EE7B0"
yellowColor = "#F5C04E"
yellowBackgroundColor = "#33280F"
yellowTextColor = "#F7C76B"
orangeColor = "#F5A25A"
orangeBackgroundColor = "#36220F"
orangeTextColor = "#FFB066"
redColor = "#FF8E8C"
