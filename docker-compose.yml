services:
  viralift:
    build: .
    # No .env needed to run. These default to LLM-off; Compose auto-substitutes
    # from an optional .env in this folder (or your shell) if you set them.
    # Works on all Compose versions (no env_file directive to require the file).
    environment:
      - VIRALIFT_LLM_ENABLED=${VIRALIFT_LLM_ENABLED:-0}
      - VIRALIFT_LLM_MODEL=${VIRALIFT_LLM_MODEL:-gpt-5.4-mini}
      - VIRALIFT_LLM_FALLBACK_MODEL=${VIRALIFT_LLM_FALLBACK_MODEL:-gpt-5.4}
      - VIRALIFT_LLM_MAX_ROWS=${VIRALIFT_LLM_MAX_ROWS:-20}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8501:8501"
    volumes:
      # alias configs are read/written at runtime — mount from host so
      # GUI saves (new mappings, new canonicals) survive docker rebuilds
      - ./app/config:/viralift/app/config
      # output folder — downloaded results persist on host
      - ./output:/viralift/output
      # logs — persist run history and alias audit trail across rebuilds
      - ./logs:/viralift/logs
    restart: unless-stopped
